name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write      # keyless signing of the build provenance (Sigstore)
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: build
        run: |
          set -eu
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=ks_${GITHUB_REF_NAME}_${os}_${arch}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags "-s -w -buildid= -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/ks" ./cmd/ks
            cp LICENSE README.md deploy/keyshelf.service "dist/$name/"
            tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' -czf "dist/$name.tar.gz" "$name"
          done
          cp scripts/install.sh dist/install.sh
          cd dist && sha256sum *.tar.gz install.sh > SHA256SUMS
      - name: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/install.sh --title "keyshelf $GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
